<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>feat com naldo benny</title>
</head>
<body>
    
    <main class="container">
        <div class="icon">
            <img src="" alt="">
        </div>
        <h1>Faça um Feat com o mais mentiroso</h1>
        <p>preencha o formulario para fazer o feat  com o mais mais</p>
        <form id="formulario">
            <label for="nome">Nome artistico:</label>
                <input type="text" name="" id="nome"
                placeholder="Digite seu nome artistico" required>
                
                <label for="telefone">Digite seu numero de telefone</label>
                <input type="tel" id="telefone" placeholder="(ddd)99999-9999"
                required>
                <label for="email">Digite seu email de contato</label>
                <input type="email" id="email" placeholder="Digite seu email para contato">

                <select  id="tipo">
                    <label for="musica">escolha o tipo de musica</label>
                    <option value="">selecione uma opção</option>
                    <option value="rock">Rock</option>
                    <option value="Samba">Samba</option>
                    <option value="pagode">pagode</option>
                    <option value="funk">funk</option>
                </select>

                <label for="mensagem">OBSERVAÇÔES:</label>
                <textarea id="mensagem" placeholder="Digite sua mensagem"></textarea>
                <button type="submit">Enviar Solicitação</button>

        </form>
    </main>
    <script src="./main.js"></script>
</body>
</html>
